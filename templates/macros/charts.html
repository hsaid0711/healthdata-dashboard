<!-- macro defining format and structure of a daily chart - with toggle switch
for trend line -->

{% macro daily_chart(title, canvas_id, toggle_id) %}
<div class="col-12 col-md-6">
  <div class="p-3 border rounded">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">{{ title }}</h5>

      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="{{ toggle_id }}">
        <label class="form-check-label" for="{{ toggle_id }}">
          Trend line
        </label>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="{{ canvas_id }}"></canvas>
    </div>
  </div>
</div>
{% endmacro %}

<!-- macro defining format and structure of a cumulative chart - with total displayed
top right -->

{% macro cumulative_chart(title, canvas_id, label, value) %}
<div class="col-12 col-md-6">
  <div class="p-3 border rounded">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">{{ title }}</h5>
      <!-- tooltip to highlight that the total is til Jan 2026 -->
      <p class="mb-0 total-value" data-bs-toggle="tooltip" title="Total to Jan 2026">
        <strong>{{ label }}:</strong> {{ "{:,}".format(value) }}
      </p>
    </div>
    <div class="chart-container">
      <canvas id="{{ canvas_id }}"></canvas>
    </div>
  </div>
</div>
{% endmacro %}
