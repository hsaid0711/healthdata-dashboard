<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">

    <title>{% block title %}COVID Dashboard{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Moving my stylesheet to after Bootstrap so that it takes precendence-->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <!-- added to use the mobile friendly 'hamburger' style menu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
<!--Improved nav bar to ensure mobile friendly layout - assistance from AI, my original code at end in comments-->
    <nav class="navbar navbar-expand-md navbar-light">
      <div class="container">

        <!-- Mobile hamburger button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible content -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}">Country Selection</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('about') }}">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('future') }}">Extensions</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4 text-center">
      <h2 class="mb-2">
        {% if stats and stats.country %}
        COVID-19 Dashboard — {{ stats.country }}
        {% else %}
        COVID-19 Global Data Dashboard
        {% endif %}
      </h2>
      <p class="text-muted mb-4">
        Explore COVID-19 trends by country
      </p>
    </div>

    <!-- fill the content to the rest of the page -->
    <main class="d-flex flex-column" style="min-height: 100vh;">
      <div class="flex-grow-1 d-flex justify-content-center align-items-start py-3">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer>
      Copyright &copy; 2026
    </footer>
  </body>
</html>
